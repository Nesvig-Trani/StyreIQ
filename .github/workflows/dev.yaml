name: Release dev

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  code-checks:
    name: Run code checks and quality tools
    uses: ./.github/workflows/_code_checks.yaml

  migrate:
    name: Run the migrations on the dev database
    uses: ./.github/workflows/_migrate.yaml
    with:
      environment: Development
    secrets:
      db_uri: ${{ secrets.DEV_POSTGRES_URL }}
      smtp_host: ${{ secrets.SMTP_HOST }}
      smtp_user: ${{ secrets.SMTP_USER }}
      smtp_pass: ${{ secrets.SMTP_PASS }}
      from_address: ${{ secrets.FROM_ADDRESS }}
      from_name: ${{ secrets.FROM_NAME }}
      next_public_base_url: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      next_public_node_env: ${{ secrets.NEXT_PUBLIC_NODE_ENV }}
      payload_secret: ${{ secrets.PAYLOAD_SECRET }}
      postgres_uri: ${{ secrets.DEV_POSTGRES_URL }}
      resend_api_key: ${{ secrets.RESEND_API_KEY }}
      local_email_to_address: ${{ secrets.LOCAL_EMAIL_TO_ADDRESS }}
      demo_request_to_address: ${{ secrets.DEMO_REQUEST_TO_ADDRESS }}
      demo_scheduling_url: ${{ secrets.DEMO_SCHEDULING_URL }}
      base_social_media_api_url: ${{ secrets.BASE_SOCIAL_MEDIA_API_URL }}
